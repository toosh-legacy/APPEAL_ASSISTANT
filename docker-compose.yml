name: appeal-assistant

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: appeal
      POSTGRES_PASSWORD: appeal_local_only
      POSTGRES_DB: appeal
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appeal -d appeal"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis/redis-stack-server:7.4.0-v3  # Redis + RediSearch (vector search for the LiteLLM semantic cache)
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --loose --skipApiVersionCheck
    ports:
      - "10000:10000"
    volumes:
      - azurite:/data

  # Everything in containers: `docker compose --profile apps up --build` (web on :3100, API on :8000).
  # The same images run on Azure Container Apps in Phase C. Needs ml/artifacts/ (run `make train` first).
  api:
    profiles: ["apps"]
    build: { context: ., dockerfile: services/api/Dockerfile }
    image: appeal-api:local
    env_file: .env
    environment: &app_env
      DATABASE_URL: postgresql+psycopg://appeal:appeal_local_only@postgres:5432/appeal
      REDIS_URL: redis://redis:6379/0
      BLOB_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
      WORKER_MODE: separate
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      azurite: { condition: service_started }

  worker:
    profiles: ["apps"]
    image: appeal-api:local
    command: ["python", "-m", "appeal_worker.main"]
    env_file: .env
    environment: *app_env
    healthcheck: { disable: true }
    depends_on:
      api: { condition: service_started }

  web:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { NEXT_PUBLIC_API_URL: "http://localhost:8000" }
    image: appeal-web:local
    ports: ["3100:3100"]
    depends_on: [api]

  jaeger:
    profiles: ["obs"]
    image: jaegertracing/all-in-one:1.57
    ports: ["16686:16686", "4318:4318"]

  servicebus-emulator:
    profiles: ["servicebus"]
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    environment:
      ACCEPT_EULA: "Y"

volumes:
  pgdata:
  azurite:
