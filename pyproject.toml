[project]
name = "appeal-assistant"
version = "0.1.0"
description = "Multi-agent assistant that helps patients appeal denied health insurance claims (local-first build)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "redis>=5.0",
  "azure-storage-blob>=12.20",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "lxml>=5.2",
  "pandas>=2.2",
  "pyarrow>=16",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "matplotlib>=3.8",
  "pypdf>=4.2",
  "cryptography>=42",
  "python-docx>=1.1",
  "reportlab>=4.2",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-api>=1.25",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1.5",
  "openai>=1.60",
  "langchain>=1.0",
  "langchain-openai>=1.0",
  "langgraph>=1.0",
  "langgraph-checkpoint-postgres>=2.0",
  "langgraph-checkpoint-sqlite>=2.0",
  "langchain-postgres>=0.0.15",
  "sse-starlette>=2.1",
  "ics>=0.7",
  "duckdb>=1.1",
  "mlflow>=2.18",
  "optuna>=4.0",
  "weasyprint>=63",
  "litellm>=1.60",
  "langchain-litellm>=0.2",
  "soundfile>=0.14.0",
  "redisvl>=0.4",
]

[project.optional-dependencies]
nlp = [
  "presidio-analyzer>=2.2",
  "sentence-transformers>=3.0",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
evals = [
    "dspy>=2.6",
    "ragas>=0.4",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "types-PyYAML",
  "textstat>=0.7.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "packages/core/appeal_core",
  "services/api/appeal_api",
  "services/worker/appeal_worker",
  "data/pipeline/appeal_data",
  "data/synth/appeal_synth",
  "ml/appeal_ml",
  "evals/appeal_evals",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "full: needs the Docker services (Postgres, Redis, Azurite)",
  "azure: Azure adapter contract tests; run only when Azure env vars are set",
  "slow: slow tests",
]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["data/raw", "var", "apps/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "B023", "B904", "B905", "B017"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.hatch.metadata]
allow-direct-references = true
